endpoints:
  - group: Providers
    name: 1Password
    url: https://my.1password.com
    alerts:
      - type: email
    conditions:
      - "[STATUS] == any(200, 401, 403)"
      - "[RESPONSE_TIME] < 5000"
  - group: Providers
    name: Backblaze
    url: https://backblaze.com
    alerts:
      - type: email
    conditions:
      - "[STATUS] == any(200, 401, 403)"
      - "[RESPONSE_TIME] < 5000"
  - group: Providers
    name: Cloudflare
    url: https://dash.cloudflare.com
    alerts:
      - type: email
    conditions:
      - "[STATUS] == any(200, 401, 403)"
      - "[RESPONSE_TIME] < 5000"
  - group: Providers
    name: Cloudflare DNS
    url: 1.1.1.1
    alerts:
      - type: email
    conditions:
      - "[CONNECTED] == true"
      - "[DNS_RCODE] == NOERROR"
      - "[RESPONSE_TIME] < 5000"
    dns:
      query-name: excloo.net
      query-type: A
  - group: Providers
    name: Control D
    url: https://controld.com
    alerts:
      - type: email
    conditions:
      - "[STATUS] == any(200, 401, 403)"
      - "[RESPONSE_TIME] < 5000"
  - group: Providers
    name: Control D DNS
    url: 76.76.2.0
    alerts:
      - type: email
    conditions:
      - "[CONNECTED] == true"
      - "[DNS_RCODE] == NOERROR"
      - "[RESPONSE_TIME] < 5000"
    dns:
      query-name: excloo.dev
      query-type: A
  - group: Providers
    name: Fly.io
    url: https://fly.io/dashboard
    alerts:
      - type: email
    conditions:
      - "[STATUS] == any(200, 401, 403)"
      - "[RESPONSE_TIME] < 5000"
  - group: Providers
    name: GitHub
    url: https://github.com/maxexcloo
    alerts:
      - type: email
    conditions:
      - "[STATUS] == any(200, 401, 403)"
      - "[RESPONSE_TIME] < 5000"
  - group: Providers
    name: Oracle Cloud
    url: https://cloud.oracle.com
    alerts:
      - type: email
    conditions:
      - "[STATUS] == any(200, 401, 403)"
      - "[RESPONSE_TIME] < 5000"
  - group: Providers
    name: Resend
    url: https://resend.com/overview
    alerts:
      - type: email
    conditions:
      - "[STATUS] == any(200, 401, 403)"
      - "[RESPONSE_TIME] < 5000"
  - group: Providers
    name: Tailscale
    url: https://login.tailscale.com/admin
    alerts:
      - type: email
    conditions:
      - "[STATUS] == any(200, 401, 403)"
      - "[RESPONSE_TIME] < 5000"
  - group: Providers
    name: UniFi
    url: https://unifi.ui.com
    alerts:
      - type: email
    conditions:
      - "[STATUS] == any(200, 401, 403)"
      - "[RESPONSE_TIME] < 5000"
