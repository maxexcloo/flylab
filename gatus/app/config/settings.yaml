alerting:
  email:
    from: excloo-gatus@excloo.dev
    host: smtp.resend.com
    password: ${RESEND_API_KEY}
    port: 465
    to: max@excloo.com
    username: resend
    default-alert:
      description: Gatus Check Failed
      failure-threshold: 5
      send-on-resolved: true
      success-threshold: 5
ui:
  # Lay endpoint cards out as list rows; the classes are Gatus's own hooks for custom CSS.
  custom-css: |
    .grid:has(> .endpoint) { display: flex; flex-direction: column; gap: 0; }
    .grid > .endpoint { border-radius: 0; border-width: 0 0 1px; box-shadow: none; transform: none; }
    .grid > .endpoint:last-child { border-bottom-width: 0; }
    .endpoint .endpoint-header { padding: 0.5rem 1rem 0; }
    .endpoint .endpoint-content { padding: 0.25rem 1rem 0.5rem; }
    .endpoint .endpoint-content .rounded-sm { height: 1rem; }
    .endpoint .endpoint-content .mt-1 { display: none; }
    @media (min-width: 768px) {
      .grid > .endpoint { flex-direction: row; align-items: center; }
      .endpoint .endpoint-header { flex: 0 0 35%; padding: 0.5rem 1rem; }
      .endpoint .endpoint-content { padding: 0.5rem 1rem; }
    }
    .endpoint-group-content:has(.endpoint) { padding: 0; }
  dashboard-heading: Gatus
  dashboard-subheading: Health Monitoring & Status Page
  default-filter-by: failing
  default-sort-by: group
  description: Health Monitoring & Status Page
  header: Gatus
  title: Gatus
