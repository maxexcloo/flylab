app = "excloo-gatus"
primary_region = "syd"

[http_service]
auto_stop_machines = "off"
force_https = true
internal_port = 8080
min_machines_running = 1

[[http_service.checks]]
grace_period = "60s"
interval = "30s"
path = "/health"
timeout = "5s"

[[mounts]]
destination = "/data"
source = "gatus_data"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory_mb = 256
