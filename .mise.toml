[tools]
# Kubelab's service inventory renderer runs flux and kubectl.
flux2 = "latest"
flyctl = "latest"
kubectl = "latest"

# Development
[tasks.render]
description = "Render Gatus Without Resolving Secrets Or Deploying"
run = '''
set -eu
output=${FLYLAB_RENDER_DIRECTORY:-$(mktemp -d)}
cp -R gatus/. "$output"
uv run --script gatus/render.py "$output"
echo "$output"
'''
