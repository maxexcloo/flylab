[tools]
1password-cli = "2.38.1"
actionlint = "1.7.12"
flyctl = "0.4.77"
gomplate = "5.2.0"
hadolint = "2.15.1"
prek = "0.4.12"
prettier = "3.9.6"
ruff = "0.16.1"
uv = "0.12.1"

[tasks.check]
description = "Run all repository checks"
run = "prek run --all-files"

[tasks.cleanup]
description = "Remove rendered artefacts, caches, and bytecode"
run = """
find . -path ./.git -prune -o \
  -type d \\( -name .render -o -name .ruff_cache -o -name __pycache__ \\) \
  -prune -exec rm -rf -- {} +
find . -path ./.git -prune -o -type f -name '*.pyc' -exec rm -f -- {} +
"""

[tasks.fmt]
description = "Format all files"
run = """
prettier --write .
ruff check --fix --select I .
ruff format .
"""

[tasks.setup]
description = "Install Git hooks"
run = "prek install"
