[tools]
actionlint = "1.7.12"
gomplate = "5.2.0"

[tasks.check]
description = "Render configuration and lint workflows"
depends = ["render"]
run = "actionlint .github/workflows/*.yml"

[tasks.render]
description = "Render deployment configuration"
run = """
: "${SERVICE_PATH:?SERVICE_PATH is required}"
[[ "$SERVICE_PATH" =~ ^[a-z0-9][a-z0-9-]*$ ]]

render_path=".render/$SERVICE_PATH"
mkdir -p "$render_path"
find "$render_path" -mindepth 1 -delete
rsync -a --exclude '*.tmpl' "$SERVICE_PATH/" "$render_path/"

find "$SERVICE_PATH" -type f -name '*.tmpl' -print0 |
  while IFS= read -r -d '' template; do
    relative_path=${template#"$SERVICE_PATH/"}
    output_path="$render_path/${relative_path%.tmpl}"
    mkdir -p "${output_path%/*}"
    gomplate --file "$template" --out "$output_path"
  done
"""
