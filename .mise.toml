[env]
FLYLAB_RENDER_DIRECTORY = "{{ env.TMPDIR | default(value='/tmp') | trim_end(pat='/') }}/flylab-render"

[vars]
python = "uv run --no-project --python python"

[tools]
flyctl = "latest"
hadolint = "latest"
# Match the Kubernetes renderer owned by Kubelab; dependency updates skip it.
kubectl = "1.37.1"
"pipx:check-jsonschema" = "latest"

# Development
[tasks.check]
description = "Run Static & Rendering Checks"
depends = ["check:render", "check:static"]

[tasks."check:render"]
description = "Render Every Configured Service Without Resolving Secrets"
run = '{{vars.python}} .github/scripts/fly.py --render-all'

[tasks."check:static"]
description = "Check Repository Files Without Fetching Inventories"
depends = [
  "check:actions",
  "check:mise",
  "check:oxfmt",
  "check:python",
  "check:shell",
  "check:updates",
  "check:whitespace",
]
run = """
check-jsonschema --builtin-schema github-workflows .github/workflows/*.yaml
hadolint --failure-threshold error */Dockerfile
"""

[tasks.cleanup]
description = "Remove Rendered Artefacts"
run = 'rm -fr -- "$FLYLAB_RENDER_DIRECTORY"'

[tasks.fmt]
description = "Format Supported Files"
depends = ["fmt:oxfmt", "fmt:python"]

[tasks.render]
description = "Render A Service Without Resolving Secrets Or Deploying"
run = '{{vars.python}} .github/scripts/fly.py --render "$usage_service"'
usage = 'arg "<service>"'

# Deployment
[tasks."deployments:reconcile"]
description = "Deploy Or Delete The Selected Fly App (GitHub Actions Only)"
run = "{{vars.python}} .github/scripts/fly.py"

[tasks."deployments:select"]
description = "Select Deployments For The Current GitHub Actions Event"
run = "{{vars.python}} .github/scripts/select-deployments.py"

# Dependencies
[tasks."dependencies:mise:check"]
run = "mise upgrade --bump --dry-run --exclude kubectl --local --no-prune"

[tasks."dependencies:mise:update"]
run = "mise upgrade --bump --exclude kubectl --local --no-prune"
