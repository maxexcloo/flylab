[tools]
1password-cli = "2.41.0"
actionlint = "1.7.12"
flyctl = "0.4.117"
hadolint = "2.15.1"
kubectl = "1.37.1"
prek = "0.5.5"
prettier = "3.9.10"
python = "3.15.0"
ruff = "0.17.0"
shellcheck = "0.11.0"
updatecli = "0.122.1"
uv = "0.13.1"
yq = "4.54.1"

[tasks.check]
description = "Run All Repository Checks"
run = "prek run --all-files"

[tasks.cleanup]
description = "Remove Rendered Artefacts, Caches, & Bytecode"
run = """
find . -path ./.git -prune -o \
  -type d \\( -name .render -o -name .ruff_cache -o -name __pycache__ \\) \
  -prune -exec rm -fr -- {} +
find . -path ./.git -prune -o -type f -name '*.pyc' -exec rm -f -- {} +
"""

[tasks.fmt]
description = "Format All Files"
run = """
prettier --write .
ruff check --fix --select I .
ruff format .
"""

[tasks.render]
description = "Render A Service Without Resolving Secrets Or Deploying"
run = 'uv run --no-project --python python .github/scripts/fly.py --render "$usage_service"'
usage = 'arg "<service>"'

[tasks.setup]
description = "Install Git Hooks"
run = "prek install"

# Dependency Updates
[tasks."dependencies:check"]
description = "Preview Local Dependency Updates"
run = """
GITHUB_TOKEN="$(gh auth token)"
export GITHUB_TOKEN
updatecli pipeline diff --config .updatecli.d --disable-changelog --disable-udash-report --unique-tmp-dir
"""

[tasks."dependencies:update"]
description = "Apply Reviewed Local Dependency Updates"
usage = 'flag "--labels <labels>" help="Select Updatecli groups, such as group:tools"'
run = """
GITHUB_TOKEN="$(gh auth token)"
export GITHUB_TOKEN
set --
if [ -n "${usage_labels:-}" ]; then
  set -- --labels "$usage_labels"
fi
updatecli pipeline apply --config .updatecli.d --disable-changelog --disable-udash-report --unique-tmp-dir "$@"
"""
