# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update pyyaml In gatus/requirements.txt
pipelineid: update-pyyaml-in-gatus-requirements-txt
labels:
  group: python
sources:
  version:
    kind: pypi
    spec:
      name: pyyaml
      versionfilter:
        kind: pep440
        pattern: "*"
targets:
  pin:
    kind: file
    sourceid: version
    spec:
      file: gatus/requirements.txt
      matchpattern: (pyyaml==)[0-9.]+
      replacepattern: ${1}{{ source "version" }}
