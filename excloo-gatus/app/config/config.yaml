alerting:
  email:
    from: gatus-fly@excloo.dev
    host: smtp.resend.com
    password: ${MAIL_PASSWORD}
    port: 465
    to: max@excloo.com
    username: resend
    default-alert:
      description: Gatus Check Failed
      failure-threshold: 5
      send-on-resolved: true
      success-threshold: 5

endpoints:
  - group: " excloo.dev"
    name: "Actual Budget (au-truenas)"
    url: "https://actual-budget.truenas.au.excloo.dev"

    alerts:
      - type: email

    conditions:
      - "[CERTIFICATE_EXPIRATION] > 168h"

      - "[RESPONSE_TIME] < 5000"

      - "[STATUS] == any(200, 401)"

    headers:
      X-Gatus-Token: "${MONITORING_TOKEN_ACTUAL_BUDGET_AU_TRUENAS}"

