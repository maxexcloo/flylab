repos:
  - repo: builtin
    hooks:
      - id: check-added-large-files
        args:
          - --maxkb=1024
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-github-workflows
      - id: check-renovate
  - repo: local
    hooks:
      - id: actionlint
        name: Lint GitHub Actions workflows
        entry: mise exec -- actionlint
        files: ^\.github/workflows/.*\.yaml$
        language: system
      - id: gatus-tests
        name: Check Gatus inventory conversion
        entry: mise exec -- uv run --no-project --python ">=3.11" --with pyyaml==6.0.3 python -m unittest discover -s gatus/tests
        files: ^(gatus/|\.github/scripts/)
        language: system
        pass_filenames: false
      - id: hadolint
        name: Lint Dockerfiles
        entry: mise exec -- hadolint
        language: system
        args:
          - --failure-threshold
          - error
        types:
          - dockerfile
      - id: prettier
        name: Check formatting
        entry: mise exec -- prettier --check
        files: \.(json|md|yaml)$
        language: system
      - id: ruff-check
        name: Lint Python
        entry: mise exec -- ruff check --extend-select I
        language: system
        types:
          - python
      - id: ruff-format
        name: Check Python formatting
        entry: mise exec -- ruff format --check
        language: system
        types:
          - python
