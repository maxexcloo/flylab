name: Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - renovate.json
  workflow_dispatch:
    inputs:
      action:
        description: Action
        default: deploy
        type: choice
        options:
          - deploy
          - delete
      deployment:
        description: Deployment key or app name
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Check & Select
    runs-on: ubuntu-latest
    outputs:
      deployments: ${{ steps.select.outputs.deployments }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up tools
        uses: jdx/mise-action@v4
        with:
          version: 2026.8.1
      - name: Run checks
        run: mise run check
      - name: Select deployments
        id: select
        env:
          CONFIG: ${{ vars.CONFIG }}
        run: uv run --no-project .github/scripts/select-deployments.py

  run:
    name: ${{ matrix.deployment.action == 'deploy' && 'Deploy' || 'Delete' }} ${{ matrix.deployment.key }}
    needs: prepare
    if: needs.prepare.outputs.deployments != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deployment: ${{ fromJSON(needs.prepare.outputs.deployments) }}
    concurrency:
      cancel-in-progress: false
      group: fly-${{ matrix.deployment.app }}
    env:
      DEPLOYMENT: ${{ toJSON(matrix.deployment) }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up tools
        uses: jdx/mise-action@v4
        with:
          version: 2026.8.1
      - name: Delete
        if: matrix.deployment.action == 'delete'
        run: uv run --no-project .github/scripts/fly.py
      - name: Deploy
        if: matrix.deployment.action == 'deploy'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: uv run --no-project .github/scripts/fly.py
