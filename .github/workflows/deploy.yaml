name: Deploy

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      homelab_revision:
        description: Homelab Commit SHA (Defaults To Current Main)
        required: false
        type: string
      kubelab_revision:
        description: Kubelab Commit SHA (Defaults To Current Main)
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ github.event_name == 'pull_request' && 'Check' || 'Check & Deploy' }}
    runs-on: ubuntu-latest
    concurrency:
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
      group: deploy-${{ github.event.pull_request.number || 'main' }}
    env:
      FLYLAB_RENDER_DIRECTORY: /tmp/flylab-render
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Shared Tools & Tasks
        uses: maxexcloo/dotfiles/.github/actions/mise@main
        with:
          project-tools: true
          tools: 1password-cli actionlint jq node@24 npm:renovate oxfmt python ruff shellcheck uv yq
      - name: Run Checks
        run: mise run check
      - name: Render
        run: mise run render
        env:
          HOMELAB_REVISION: ${{ inputs.homelab_revision }}
          KUBELAB_REVISION: ${{ inputs.kubelab_revision }}
      - if: github.event_name != 'pull_request'
        name: Deploy
        run: fnox exec -- python .github/scripts/fly.py
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
