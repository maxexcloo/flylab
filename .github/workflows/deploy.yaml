name: Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      action:
        description: Action
        default: deploy
        type: choice
        options:
          - deploy
          - delete
      deployment:
        description: Deployment key or app name
        required: false
        type: string
      homelab_revision:
        description: Homelab commit SHA (defaults to current main)
        required: false
        type: string
      kubelab_revision:
        description: Kubelab commit SHA (defaults to current main)
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Prek
    uses: ./.github/workflows/prek.yaml

  prepare:
    name: Select
    needs: check
    runs-on: ubuntu-latest
    outputs:
      deployments: ${{ steps.select.outputs.deployments }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up tools
        uses: jdx/mise-action@v5
        with:
          install_args: python uv
          version: 2026.10.3
      - name: Select deployments
        id: select
        run: uv run --python python --no-project .github/scripts/select-deployments.py

  reconcile:
    name: ${{ matrix.deployment.action == 'deploy' && 'Deploy' || 'Delete' }} ${{ matrix.deployment.key }}
    needs: prepare
    if: needs.prepare.outputs.deployments != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deployment: ${{ fromJSON(needs.prepare.outputs.deployments) }}
    concurrency:
      cancel-in-progress: false
      group: fly-${{ matrix.deployment.app }}
    env:
      DEPLOYMENT: ${{ toJSON(matrix.deployment) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up tools
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.3
      - name: Render
        if: matrix.deployment.action == 'deploy'
        env:
          HOMELAB_REVISION: ${{ inputs.homelab_revision }}
          KUBELAB_REVISION: ${{ inputs.kubelab_revision }}
          SERVICE_DIRECTORY: ${{ matrix.deployment.directory }}
        run: mise run render "$SERVICE_DIRECTORY"
      - name: Delete
        if: matrix.deployment.action == 'delete'
        env:
          FLY_API_TOKEN: op://Flylab/Fly.io/password
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: op run -- uv run --python python --no-project .github/scripts/fly.py
      - name: Deploy
        if: matrix.deployment.action == 'deploy'
        env:
          FLY_API_TOKEN: op://Flylab/Fly.io/password
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: op run -- uv run --python python --no-project .github/scripts/fly.py
