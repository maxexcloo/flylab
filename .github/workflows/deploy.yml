name: Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - renovate.json
  workflow_dispatch:
    inputs:
      deployment:
        description: Deployment key or app name; omit to deploy all
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Check and Select
    runs-on: ubuntu-latest
    outputs:
      deployments: ${{ steps.select.outputs.deployments }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup tools
        uses: jdx/mise-action@v4
        with:
          version: 2026.8.1
      - name: Run checks
        run: mise run check
      - name: Select deployments
        id: select
        env:
          HOMELAB_CATALOG: ${{ vars.HOMELAB_CATALOG }}
          SELECTION: ${{ inputs.deployment }}
        run: uv run --no-project .github/scripts/select-deployments.py

  deploy:
    if: needs.prepare.outputs.deployments != '[]'
    name: Deploy ${{ matrix.deployment.key }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deployment: ${{ fromJSON(needs.prepare.outputs.deployments) }}
    concurrency:
      cancel-in-progress: false
      group: fly-${{ matrix.deployment.app }}
    env:
      DEPLOYMENT: ${{ toJSON(matrix.deployment) }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      SERVICE_PATH: ${{ matrix.deployment.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup tools
        uses: jdx/mise-action@v4
        with:
          install_args: gomplate uv
          version: 2026.8.1
      - name: Render configuration
        env:
          HOMELAB_CATALOG: ${{ vars.HOMELAB_CATALOG }}
        run: mise run render
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@1.5
      - name: Setup 1Password CLI
        uses: 1password/install-cli-action@v4
      - name: Deploy
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: uv run --no-project .github/scripts/deploy.py
