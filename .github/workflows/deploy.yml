name: Deploy

on:
  push:
    paths-ignore:
      - README.md
      - renovate.json
  workflow_dispatch:
    inputs:
      action:
        description: Action
        options:
          - deploy
          - delete
        default: deploy
        type: choice
      service:
        description: Service name; required for deletion, optional for deployment
        required: false
        type: string

permissions:
  contents: read

jobs:
  select:
    name: Select Services
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.select.outputs.action }}
      services: ${{ steps.select.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Select Services
        id: select
        env:
          ACTION: ${{ inputs.action || 'deploy' }}
          EVENT_NAME: ${{ github.event_name }}
          SERVICE: ${{ inputs.service }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == workflow_dispatch && -n "$SERVICE" ]]; then
            [[ "$SERVICE" =~ ^[a-z0-9][a-z0-9-]*$ ]] || {
              echo "Invalid service: $SERVICE" >&2
              exit 1
            }
            if [[ "$ACTION" == deploy && ! -f "$SERVICE/fly.toml" ]]; then
              echo "No deployment found for service: $SERVICE" >&2
              exit 1
            fi
            services=$(jq -cn --arg service "$SERVICE" '[$service]')
          elif [[ "$ACTION" == delete ]]; then
            echo "A service is required for deletion" >&2
            exit 1
          else
            services=$(
              find . -mindepth 2 -maxdepth 2 -name fly.toml -print |
                sed -E 's#^\./##; s#/fly\.toml$##' |
                sort |
                jq -Rsc 'split("\n") | map(select(length > 0))'
            )
          fi

          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "services=$services" >> "$GITHUB_OUTPUT"

  deploy:
    if: needs.select.outputs.services != '[]'
    name: ${{ needs.select.outputs.action }} ${{ matrix.service }}
    needs: select
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        service: ${{ fromJSON(needs.select.outputs.services) }}
    concurrency:
      cancel-in-progress: false
      group: fly-${{ matrix.service }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      SERVICE: ${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@1
      - name: Setup 1Password CLI
        if: needs.select.outputs.action == 'deploy'
        uses: 1password/install-cli-action@v2
      - name: Delete
        if: needs.select.outputs.action == 'delete'
        shell: bash
        run: |
          set -euo pipefail
          if flyctl apps info "$SERVICE" >/dev/null 2>&1; then
            flyctl apps destroy "$SERVICE" --yes
          else
            echo "$SERVICE does not exist"
          fi
      - name: Deploy
        if: needs.select.outputs.action == 'deploy'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          secrets_file=$(mktemp)
          trap 'rm -f "$secrets_file"' EXIT
          .github/scripts/resolve-secrets "$SERVICE/secrets.json" > "$secrets_file"

          cd "$SERVICE"

          if ! flyctl apps info "$SERVICE" >/dev/null 2>&1; then
            flyctl apps create "$SERVICE"
          fi

          mapfile -t current_secrets < <(
            flyctl secrets list --app "$SERVICE" --json |
              jq -r '.[] | .Name // .name' |
              sort
          )
          mapfile -t desired_secrets < <(
            jq -r '.secrets | keys[]' secrets.json
          )
          mapfile -t stale_secrets < <(
            comm -23 \
              <(printf '%s\n' "${current_secrets[@]}" | sed '/^$/d') \
              <(printf '%s\n' "${desired_secrets[@]}" | sed '/^$/d')
          )
          if (( ${#stale_secrets[@]} > 0 )); then
            flyctl secrets unset "${stale_secrets[@]}" --app "$SERVICE" --stage
          fi
          if [[ -s "$secrets_file" ]]; then
            flyctl secrets import --app "$SERVICE" --stage < "$secrets_file"
          fi

          mapfile -t current_certs < <(
            flyctl certs list --app "$SERVICE" --json |
              jq -r '.[] | .Hostname // .hostname' |
              sort
          )
          mapfile -t desired_certs < <(
            if [[ -f .certs ]]; then
              sed '/^$/d' .certs | sort -u
            fi
          )
          while IFS= read -r hostname; do
            [[ -n "$hostname" ]] && flyctl certs remove "$hostname" --app "$SERVICE" --yes
          done < <(
            comm -23 \
              <(printf '%s\n' "${current_certs[@]}" | sed '/^$/d') \
              <(printf '%s\n' "${desired_certs[@]}" | sed '/^$/d')
          )
          while IFS= read -r hostname; do
            [[ -n "$hostname" ]] && flyctl certs add "$hostname" --app "$SERVICE"
          done < <(
            comm -13 \
              <(printf '%s\n' "${current_certs[@]}" | sed '/^$/d') \
              <(printf '%s\n' "${desired_certs[@]}" | sed '/^$/d')
          )

          flyctl deploy --app "$SERVICE" --config fly.toml
          if [[ -s .machine-count ]]; then
            flyctl scale count "$(< .machine-count)" --app "$SERVICE"
          fi
