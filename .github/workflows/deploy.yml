name: Deploy

jobs:
  prepare:
    name: Check and Select
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.select.outputs.action }}
      deployments: ${{ steps.select.outputs.deployments }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup tools
        uses: jdx/mise-action@v4
        with:
          version: 2026.8.1
      - name: Run checks
        run: mise run check
      - name: Select deployments
        id: select
        env:
          ACTION: ${{ inputs.action || 'deploy' }}
          HOMELAB_CATALOG: ${{ vars.HOMELAB_CATALOG }}
          SELECTION: ${{ inputs.deployment }}
        run: uv run --no-project .github/scripts/select-deployments.py

  run:
    if: needs.prepare.outputs.deployments != '[]'
    name: ${{ needs.prepare.outputs.action }} ${{ matrix.deployment.key }}
    needs: prepare
    runs-on: ubuntu-latest
    concurrency:
      cancel-in-progress: false
      group: fly-${{ matrix.deployment.app }}
    env:
      ACTION: ${{ needs.prepare.outputs.action }}
      DEPLOYMENT: ${{ toJSON(matrix.deployment) }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@v9
      - name: Setup render tools
        if: needs.prepare.outputs.action == 'deploy'
        uses: jdx/mise-action@v4
        with:
          install_args: gomplate
          version: 2026.8.1
      - name: Render configuration
        if: needs.prepare.outputs.action == 'deploy'
        env:
          HOMELAB_CATALOG: ${{ vars.HOMELAB_CATALOG }}
          SERVICE_PATH: ${{ matrix.deployment.service }}
        run: mise run render
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@1.5
      - name: Setup 1Password CLI
        if: needs.prepare.outputs.action == 'deploy'
        uses: 1password/install-cli-action@v4
      - name: Delete
        if: needs.prepare.outputs.action == 'delete'
        run: uv run --no-project .github/scripts/fly.py
      - name: Deploy
        if: needs.prepare.outputs.action == 'deploy'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: uv run --no-project .github/scripts/fly.py
    strategy:
      fail-fast: false
      matrix:
        deployment: ${{ fromJSON(needs.prepare.outputs.deployments) }}

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - renovate.json
  workflow_dispatch:
    inputs:
      action:
        default: deploy
        description: Action
        options:
          - delete
          - deploy
        type: choice
      deployment:
        description: Deployment key, app name, or app to delete
        required: false
        type: string

permissions:
  contents: read
