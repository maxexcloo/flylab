name: Delete

on:
  workflow_dispatch:
    inputs:
      app:
        description: Fly app name
        required: true
        type: string

permissions:
  contents: read

jobs:
  delete:
    name: Delete ${{ inputs.app }}
    runs-on: ubuntu-latest
    concurrency:
      cancel-in-progress: false
      group: fly-${{ inputs.app }}
    env:
      APP: ${{ inputs.app }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@1.5
      - name: Delete
        run: bash .github/scripts/delete.sh
