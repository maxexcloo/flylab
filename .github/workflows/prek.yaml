name: Prek

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: prek-${{ github.workflow }}-${{ github.ref }}

jobs:
  prek:
    name: Prek
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up tools
        uses: jdx/mise-action@v5
        with:
          install_args: actionlint hadolint prek prettier ruff shellcheck uv
          version: 2026.10.1
      - name: Run checks
        run: mise run check
