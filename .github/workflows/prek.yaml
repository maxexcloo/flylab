name: Prek

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prek:
    name: Prek
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure Global Tools
        run: |
          mkdir -p "$HOME/.config/mise"
          sed -n '/^\[tools\]$/p; s/^# \([^ ]* = "latest"\)$/\1/p' .mise.toml > "$HOME/.config/mise/config.toml"
      - name: Set Up Tools
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.9
      - name: Run Checks
        run: mise run check
