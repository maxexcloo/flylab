name: Prek

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prek:
    name: Prek
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Tools
        uses: jdx/mise-action@v5
        with:
          install_args: actionlint hadolint prek prettier python ruff shellcheck updatecli uv
          version: 2026.10.9
      - name: Run Checks
        run: mise run check
